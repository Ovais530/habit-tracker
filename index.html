<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Execution OS">
<meta name="theme-color" content="#0A0C0F">
<meta name="description" content="Personal execution OS — daily missions, business tracking, streaks and analytics.">
<title>Execution OS</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="icon" href="./icon-512.png" sizes="512x512">
<style>
:root{
  --bg:#0A0C0F;
  --surface:#14171C;
  --surface2:#1B1F25;
  --surface3:#20242B;
  --border:#262B32;
  --text:#E8EAED;
  --text-dim:#8B93A1;
  --text-faint:#565D6B;
  --accent:#5B7CFA;
  --accent-dim:rgba(91,124,250,0.14);
  --accent-glow:rgba(91,124,250,0.35);
  --green:#3DDC84;
  --green-dim:rgba(61,220,132,0.14);
  --yellow:#F5B942;
  --yellow-dim:rgba(245,185,66,0.14);
  --red:#F5555F;
  --red-dim:rgba(245,85,95,0.14);
  --radius:14px;
  --radius-sm:10px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#F3F4F6;
  --surface:#FFFFFF;
  --surface2:#F7F8FA;
  --surface3:#EEF0F3;
  --border:#E2E4E9;
  --text:#14171C;
  --text-dim:#5A6272;
  --text-faint:#9AA1AD;
  --accent:#4C6EF5;
  --accent-dim:rgba(76,110,245,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-display);
  overscroll-behavior-y:none;
  padding-top:var(--safe-top);
  transition:background .2s ease,color .2s ease;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,select,textarea{background:var(--surface3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
::-webkit-scrollbar{width:0;height:0;}

#app{display:flex;min-height:100%;}
#sidebar{display:none;}
#main{flex:1;min-width:0;padding-bottom:calc(84px + var(--safe-bottom));}
#view{max-width:640px;margin:0 auto;padding:16px 16px 24px;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:14px 16px 4px;}
.topbar .brand{font-size:13px;letter-spacing:.14em;color:var(--text-faint);font-weight:600;text-transform:uppercase;}
.topbar .actions{display:flex;gap:8px;}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-dim);}
.iconbtn:active{background:var(--surface3);}

/* ---------- hero ---------- */
.hero{background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:20px;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden;}
.hero:before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);opacity:.5;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.hero-date{font-size:12px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;}
.hero-greet{font-size:19px;font-weight:700;}
.streak-chip{display:flex;align-items:center;gap:4px;background:var(--surface3);border:1px solid var(--border);padding:5px 10px;border-radius:100px;font-size:12px;font-weight:600;color:var(--yellow);white-space:nowrap;}
.hero-score-row{display:flex;align-items:flex-end;gap:18px;margin-top:16px;position:relative;z-index:1;}
.hero-score{font-family:var(--font-mono);font-size:52px;font-weight:700;line-height:1;letter-spacing:-1px;}
.hero-score-sub{font-size:13px;color:var(--text-dim);margin-bottom:4px;}
.hero-rating{font-size:12px;font-weight:600;margin-top:2px;}
.hero-meta{display:flex;gap:16px;margin-top:14px;position:relative;z-index:1;}
.hero-meta-item{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.hero-meta-item b{display:block;font-family:var(--font-mono);font-size:15px;color:var(--text);font-weight:600;letter-spacing:0;text-transform:none;margin-top:2px;}

/* ---------- mission cards ---------- */
.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin:20px 0 8px;padding-left:2px;}
.mission-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;position:relative;}
.mission-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px -8px var(--accent-glow);}
.mission-card.done{opacity:.55;}
.mission-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.mission-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;}
.mission-title .flag{font-size:10px;background:var(--accent-dim);color:var(--accent);padding:2px 7px;border-radius:5px;letter-spacing:.08em;}
.mission-nums{font-family:var(--font-mono);font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:3px;}
.mission-nums .target{color:var(--text-faint);font-size:15px;}
.tickbar{display:flex;gap:2px;height:16px;margin-bottom:12px;}
.tick{flex:1;border-radius:2px;background:var(--surface3);}
.tick.filled{background:var(--accent);}
.tick.over{background:var(--green);}
.mission-card.done .tick.filled{background:var(--green);}
.chiprow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.chip{font-size:11px;padding:5px 10px;border-radius:100px;background:var(--surface3);border:1px solid var(--border);color:var(--text-dim);font-weight:600;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.btnrow{display:flex;gap:8px;}
.qbtn{flex:1;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:12px 0;font-size:14px;font-weight:700;font-family:var(--font-mono);text-align:center;}
.qbtn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
.qbtn.neg{color:var(--text-faint);}
.mission-sub{font-size:11px;color:var(--text-faint);margin-top:8px;}
.toggle-btn{width:100%;padding:14px;border-radius:10px;background:var(--surface3);border:1px solid var(--border);font-weight:700;font-size:14px;letter-spacing:.04em;}
.toggle-btn.on{background:var(--green-dim);color:var(--green);border-color:var(--green);}
.checklist{display:flex;flex-direction:column;gap:6px;}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.check-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.check-box.on{background:var(--green);border-color:var(--green);color:#0A0C0F;}
.check-label{font-size:13px;flex:1;}
.check-row.strike .check-label{color:var(--text-faint);text-decoration:line-through;}
.mission-complete-badge{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.06em;}
.next-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px dashed var(--border);border-radius:100px;padding:8px 14px;font-size:12px;color:var(--text-dim);font-weight:600;margin-top:6px;}
.rail-strip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 10px;margin-bottom:12px;overflow-x:auto;}
.rail-item{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.rail-item.rail-now{flex:1.3;}
.rail-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;}
.rail-val{font-size:12px;font-weight:700;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-now .rail-val{color:var(--accent);font-size:13px;}
.rail-now .rail-label{color:var(--accent);}
.rail-sep{color:var(--text-faint);font-size:12px;flex-shrink:0;}

/* ---------- small stat cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.card-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.statgrid.two{grid-template-columns:repeat(2,1fr);}
.stat{background:var(--surface2);border-radius:10px;padding:10px;text-align:left;}
.stat-num{font-family:var(--font-mono);font-size:19px;font-weight:700;}
.stat-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.stat-btns{display:flex;gap:4px;margin-top:6px;}
.mini-btn{flex:1;background:var(--surface3);border:1px solid var(--border);border-radius:6px;font-size:10px;padding:5px 0;font-weight:700;font-family:var(--font-mono);}
.mini-btn:active{background:var(--accent);color:#fff;}

/* ---------- collapsible morning ---------- */
.collapse-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.collapse-body{margin-top:10px;}
.collapse-body.hidden{display:none;}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,23,28,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:50;}
[data-theme="light"] .bottomnav{background:rgba(255,255,255,0.92);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text-faint);}
.navbtn .navicon{font-size:18px;}
.navbtn.active{color:var(--accent);}

/* ---------- fab ---------- */
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -6px var(--accent-glow);z-index:49;}

/* ---------- sheets / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.overlay.center{align-items:center;padding:20px;}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(24px + var(--safe-bottom));border:1px solid var(--border);border-bottom:none;}
.overlay.center .sheet{border-radius:18px;border-bottom:1px solid var(--border);max-height:85vh;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.close-x{position:absolute;top:14px;right:14px;color:var(--text-faint);font-size:20px;}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-bottom));background:var(--surface3);border:1px solid var(--border);border-radius:100px;padding:9px 8px 9px 16px;display:none;align-items:center;gap:10px;z-index:200;font-size:13px;box-shadow:0 8px 20px -6px rgba(0,0,0,0.5);}
#toast button{color:var(--accent);font-weight:700;font-size:12px;padding:6px 12px;background:var(--surface2);border-radius:100px;}

/* ---------- forms ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;letter-spacing:.03em;}
.field input,.field select{width:100%;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.btn-primary{width:100%;background:var(--accent);color:#fff;padding:13px;border-radius:10px;font-weight:700;font-size:14px;margin-top:6px;}
.btn-secondary{width:100%;background:var(--surface3);border:1px solid var(--border);padding:12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--text-dim);margin-top:8px;}
.btn-danger{color:var(--red);}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:600;background:var(--surface3);border:1px solid var(--border);color:var(--text-dim);}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---------- settings list ---------- */
.settings-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.settings-group-head{padding:14px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.settings-group-body{padding:14px 16px;}
.daycard{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.daycard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.daycard-head b{font-size:13px;}
.break-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.break-row input{flex:1;}
.xrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.xrow:last-child{border-bottom:none;}
.xrow label{font-size:12px;color:var(--text-dim);}
.xrow input{width:70px;text-align:right;}

/* ---------- week/month/analytics ---------- */
.cmp-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.cmp-row:last-child{border-bottom:none;}
.cmp-label{font-size:13px;color:var(--text-dim);}
.cmp-vals{display:flex;align-items:baseline;gap:8px;}
.cmp-cur{font-family:var(--font-mono);font-size:17px;font-weight:700;}
.cmp-prev{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.cmp-delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}
.cmp-delta.up{background:var(--green-dim);color:var(--green);}
.cmp-delta.down{background:var(--red-dim);color:var(--red);}
.cmp-delta.flat{background:var(--surface3);color:var(--text-faint);}
.barchart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px;}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px;}
.barcol span{font-size:9px;color:var(--text-faint);margin-top:5px;}
.heatgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.heatcell{aspect-ratio:1;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-faint);font-family:var(--font-mono);position:relative;}
.heatcell.has{color:#fff;font-weight:700;}
.heatcell.pad{background:transparent;}
.weekday-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.weekday-hdr span{text-align:center;font-size:9px;color:var(--text-faint);text-transform:uppercase;}
.insight{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;line-height:1.5;}
.insight.warn{border-color:var(--yellow);}
.insight.bad{border-color:var(--red);}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:10px;}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:12px;font-weight:700;color:var(--text-faint);}
.tab.active{background:var(--surface3);color:var(--text);}
.range-tabs{display:flex;gap:6px;margin-bottom:14px;}
.rtab{padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text-faint);}
.rtab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
.funnel-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.funnel-row:last-child{border-bottom:none;}
.funnel-bar{height:6px;border-radius:4px;background:var(--accent);margin-top:5px;}
.empty{text-align:center;padding:40px 16px;color:var(--text-faint);}
.empty .big{font-size:32px;margin-bottom:8px;}
.level-badge{display:flex;align-items:center;gap:10px;}
.level-num{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--accent);}
.xpbar-track{background:var(--surface3);height:8px;border-radius:5px;overflow:hidden;flex:1;}
.xpbar-fill{background:var(--accent);height:100%;}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ach-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;opacity:.35;}
.ach-item.on{opacity:1;border-color:var(--accent);}
.ach-emoji{font-size:20px;}
.ach-name{font-size:10px;font-weight:700;margin-top:4px;letter-spacing:.03em;}
.ach-desc{font-size:9px;color:var(--text-faint);margin-top:2px;}
.goal-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.goal-item.done{opacity:.5;}
.goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.goal-name{font-size:13px;font-weight:700;}
.progress-track{background:var(--surface3);height:6px;border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-fill{background:var(--accent);height:100%;}
.milestone-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.milestone-row:last-child{border-bottom:none;}
.milestone-row.done .milestone-label{text-decoration:line-through;color:var(--text-faint);}
.milestone-num{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:20px;}
.link-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.link-row:last-child{border-bottom:none;}
.link-row .l{font-size:13px;font-weight:600;}
.link-row .r{color:var(--text-faint);font-size:14px;}

@media(min-width:900px){
  #app{max-width:1180px;margin:0 auto;}
  #sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;}
  .sidebrand{font-size:13px;font-weight:700;letter-spacing:.1em;padding:0 10px;margin-bottom:24px;color:var(--text-dim);}
  .sidelink{padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:2px;}
  .sidelink.active{background:var(--accent-dim);color:var(--accent);}
  .bottomnav{display:none;}
  #main{padding-bottom:24px;}
  .fab{bottom:24px;}
  #view{max-width:640px;padding:24px 24px 40px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div class="topbar">
      <div class="brand">EXECUTION OS</div>
      <div class="actions">
        <button class="iconbtn" onclick="openFocus()">◎</button>
        <button class="iconbtn" onclick="openQuickSheet()">+</button>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="bottomnav" id="bottomnav"></div>
<button class="fab" onclick="openQuickSheet()">+</button>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   EXECUTION OS — core engine
   ============================================================ */
// storage key lives in IDB_KEY, defined alongside the IndexedDB engine below
let DB=null;
let UI={ view:'today', settingsTab:'schedule', analyticsTab:'business', weekOffset:0, monthOffset:0, calMonthOffset:0, focusOpen:false, selectedChannel:'emails', morningOpen:true, nightOpen:true, calendarSelectedDate:null, weekRange:'7', scheduleOpen:true };
let saveTimer=null;
let undoStack=null;

/* ---------- date helpers ---------- */
function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return fmtDate(new Date());}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function dayAbbr(s){return ['sun','mon','tue','wed','thu','fri','sat'][parseDate(s).getDay()];}
function dayFull(s){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][parseDate(s).getDay()];}
function monLabel(s){return ['January','February','March','April','May','June','July','August','September','October','November','December'][parseDate(s).getMonth()];}
function startOfWeek(s){ // Monday
  const d=parseDate(s); const day=d.getDay(); const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); return fmtDate(d);
}
function startOfMonth(s){const d=parseDate(s);return fmtDate(new Date(d.getFullYear(),d.getMonth(),1));}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function humanDate(s){const d=parseDate(s);return dayFull(s)+', '+monLabel(s)+' '+d.getDate();}
function minsBetween(start,end){
  const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number);
  return Math.max(0,(eh*60+em)-(sh*60+sm));
}
function blockTimeLabel(b){ return b.start===b.end ? b.start : `${b.start}–${b.end}`; }
function shortDate(s){const d=parseDate(s);return monLabel(s).slice(0,3)+' '+d.getDate();}

/* ---------- IndexedDB storage engine ----------
   Replaces the previous Claude-hosted storage API. Exposes the equivalent of the
   requested getDB()/saveDB()/clearDB() primitives as idbGetState(),
   idbSetState() and idbClearState() — different names only because the
   app already has an unrelated saveDB() (the debounce trigger used
   ~80 times throughout the app for UI-driven writes). Nothing else in
   the app touches storage directly; it all goes through loadDB()/saveDB()/
   persistNow() below, exactly as before. */
const IDB_NAME='executionOS';
const IDB_VERSION=1;
const IDB_STORE='kv';
const IDB_KEY='appstate';
let _idbOpenPromise=null;
function idbOpen(){
  if(_idbOpenPromise) return _idbOpenPromise;
  _idbOpenPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB is not available in this browser')); return; }
    let req;
    try{ req=indexedDB.open(IDB_NAME,IDB_VERSION); }
    catch(err){ reject(err); return; }
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=(e)=>resolve(e.target.result);
    req.onerror=(e)=>reject((e.target&&e.target.error)||new Error('IndexedDB open failed'));
    req.onblocked=()=>reject(new Error('IndexedDB open blocked by another tab'));
  });
  return _idbOpenPromise;
}
function idbGetState(){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    try{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess=()=>resolve(req.result!==undefined?req.result:null);
      req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
    }catch(err){ reject(err); }
  }));
}
function idbSetState(value){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(value,IDB_KEY);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
      tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
    }catch(err){ reject(err); }
  }));
}
function idbClearState(){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error||new Error('IndexedDB clear failed'));
    }catch(err){ reject(err); }
  }));
}
let STORAGE_UNAVAILABLE=false;

/* ---------- app-level storage (uses the IndexedDB engine above) ---------- */
async function loadDB(){
  let loaded=null, readFailed=false, readError=null;
  try{
    loaded=await idbGetState();
  }catch(e){
    readFailed=true; readError=e;
  }
  if(loaded){
    DB=loaded;
    DB.settings=Object.assign(defaultSettings(),DB.settings||{});
    DB.settings.targets=Object.assign(defaultSettings().targets,DB.settings.targets||{});
    DB.settings.xp=Object.assign(defaultSettings().xp,DB.settings.xp||{});
    // score is a nested {power:{...},normal:{...}} structure — a plain
    // Object.assign would corrupt it if an old flat structure exists, so
    // only merge the sub-objects, and fall back to fresh defaults if the
    // saved shape doesn't match at all (e.g. pre-migration flat weights).
    if(DB.settings.score && DB.settings.score.power && DB.settings.score.normal){
      DB.settings.score.power=Object.assign({},defaultSettings().score.power,DB.settings.score.power);
      DB.settings.score.normal=Object.assign({},defaultSettings().score.normal,DB.settings.score.normal);
    }else{
      DB.settings.score=defaultSettings().score;
    }
    if(!DB.records)DB.records={};
    if(!DB.goals)DB.goals=defaultGoals();
    if(!DB.meta)DB.meta={bestStreak:0};
    if(!DB.pool)DB.pool={ready:0};
    if(!DB.schemaVersion || DB.schemaVersion<5){
      // one-time migration: adopt the new final university timetable,
      // updated weekly business targets, and the new point-based scoring
      // rubrics. Existing records, goals, streaks and XP are left
      // completely untouched (deepWorkClean just backfills as false).
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      DB.settings.targets.gymDays=defaultSettings().targets.gymDays;
      DB.settings.targets.weeklyOutreachTarget=defaultSettings().targets.weeklyOutreachTarget;
      DB.settings.targets.weeklyProspectTarget=defaultSettings().targets.weeklyProspectTarget;
      DB.settings.targets.revenueGoal=DB.settings.targets.revenueGoal||defaultSettings().targets.revenueGoal;
      if(DB.settings.executionMode==null)DB.settings.executionMode=true;
      // migrate old boolean examMode to the new 3-tier string per record
      Object.values(DB.records).forEach(r=>{
        if(typeof r.examMode==='boolean') r.examMode=r.examMode?'exam':'normal';
        if(r.businessMinutes==null) r.businessMinutes=0;
        if(r.deepWorkClean==null) r.deepWorkClean=false;
      });
      DB.schemaVersion=5;
      saveDB();
    }
    if(DB.schemaVersion<6){
      // schema v6: uni-day daytime schedule was simplified (merged class
      // blocks, dropped the after-home study/english slots in favour of
      // a short email-review/writing-practice routine) and the English
      // rotation now reserves Speaking for off days only. Only overwrite
      // the schedule if it still looks like the old default shape, so any
      // custom edits the user already made to their blocks aren't clobbered.
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      DB.schemaVersion=6;
      saveDB();
    }
    if(DB.schemaVersion<7){
      // schema v7: off days moved from Thu/Sat/Sun to Wed/Sat/Sun (Wed and
      // Thu swap roles — Thu is now the heavy university day, Wed is now a
      // power day), the English rotation shifted to match, and the
      // Business Learning quick-log buttons changed from +10/+20/+30 to
      // +15/+30 to better fit its 20-minute target. Re-apply the default
      // weekly schedule so existing users pick up the new day roles.
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      DB.schemaVersion=7;
      saveDB();
    }
    if(DB.schemaVersion<8){
      // schema v8: shutdown/skincare trimmed to a real 15-minute block
      // right before sleep, moved to 23:45–23:59 (sleep ~midnight) instead
      // of ~22:10–22:30 — the freed evening time becomes an extra business
      // block on both university evenings and power days.
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      if(DB.settings.sleepTime==='22:30') DB.settings.sleepTime='00:00';
      DB.schemaVersion=8;
      saveDB();
    }
    if(DB.schemaVersion<9){
      // schema v9: remove university class blocks from the timetable and class attendance tracking.
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      DB.schemaVersion=9;
      saveDB();
    }
    if(DB.schemaVersion<10){
      // schema v10: apply the user's updated weekly business/study schedule.
      DB.settings.weekSchedule=defaultSettings().weekSchedule;
      DB.schemaVersion=10;
      saveDB();
    }
  }else if(readFailed){
    // CRITICAL: local storage could not be read (IndexedDB unavailable,
    // private browsing, corrupted DB, blocked by another tab, etc). Do NOT
    // fabricate a blank DB and persist it — that would permanently destroy
    // any real data already on this device the moment storage recovers.
    // Run this session entirely in memory instead and tell the user clearly.
    console.warn('IndexedDB read failed — running in a temporary in-memory session, existing data (if any) was left untouched.',readError);
    DB={settings:defaultSettings(),records:{},goals:defaultGoals(),meta:{bestStreak:0},pool:{ready:0},schemaVersion:8};
    STORAGE_UNAVAILABLE=true;
    showStorageErrorBanner();
  }else{
    // Genuinely first launch on this device: no error, just nothing stored yet.
    DB={settings:defaultSettings(),records:{},goals:defaultGoals(),meta:{bestStreak:0},pool:{ready:0},schemaVersion:8};
    await persistNow();
  }
}
function saveDB(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(persistNow,450);
}
// Flush any pending save immediately when the tab is backgrounded/closed —
// on iOS Safari a debounced setTimeout can get killed before it fires,
// which is the most common cause of "my data didn't save".
function flushSave(){ clearTimeout(saveTimer); persistNow(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')flushSave(); });
window.addEventListener('pagehide',flushSave);
window.addEventListener('blur',flushSave);
let saveFailCount=0;
async function persistNow(){
  if(STORAGE_UNAVAILABLE){
    // We already know local storage is broken for this session — avoid
    // spamming failed writes. The banner (with its Retry button) is already
    // showing; a reload is what re-attempts storage cleanly.
    return false;
  }
  for(let attempt=0;attempt<3;attempt++){
    try{
      await idbSetState(DB);
      saveFailCount=0;
      hideSaveWarning();
      return true;
    }catch(e){
      if(attempt<2){ await new Promise(r=>setTimeout(r,500*(attempt+1))); continue; }
      saveFailCount++;
      console.warn('IndexedDB save failed after retries',e);
      showSaveWarning();
      return false;
    }
  }
}
function showSaveWarning(){
  let w=document.getElementById('saveWarning');
  if(!w){
    w=document.createElement('div');
    w.id='saveWarning';
    w.style.cssText='position:fixed;top:calc(var(--safe-top) + 8px);left:50%;transform:translateX(-50%);background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:700;z-index:300;max-width:92vw;text-align:center;';
    document.body.appendChild(w);
  }
  w.textContent='⚠ Not saving — storage write failed';
}
function hideSaveWarning(){
  const w=document.getElementById('saveWarning');
  if(w && !w.dataset.critical) w.remove();
}
function showStorageErrorBanner(){
  let w=document.getElementById('saveWarning');
  if(!w){
    w=document.createElement('div');
    w.id='saveWarning';
    document.body.appendChild(w);
  }
  w.dataset.critical='1';
  w.style.cssText='position:fixed;top:calc(var(--safe-top) + 8px);left:50%;transform:translateX(-50%);background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:100px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;z-index:300;max-width:92vw;';
  w.innerHTML='⚠ Local storage unavailable — nothing was erased <button onclick="location.reload()" style="background:var(--surface2);color:var(--red);border-radius:100px;padding:5px 10px;font-weight:700;">Retry</button>';
}

function getRecord(dateStr){
  if(!DB.records[dateStr]){
    const rec=defaultRecord(dateStr);
    const prev=DB.records[addDays(dateStr,-1)];
    if(prev){
      const prevTotal=(prev.outreach.emails+prev.outreach.dms+prev.outreach.other);
      rec.followupsDue=Math.round(prevTotal*DB.settings.targets.followupRatio);
    }
    DB.records[dateStr]=rec;
    saveDB();
  }
  return DB.records[dateStr];
}
function totalOutreach(rec){return rec.outreach.emails+rec.outreach.dms+rec.outreach.other;}
function getDaySchedule(dateStr){
  const day=dayAbbr(dateStr);
  let sched=DB.settings.weekSchedule[day];
  if(!sched) sched=defaultSettings().weekSchedule[day];
  if(!sched.blocks) sched.blocks=[];
  if(sched.studyTarget==null) sched.studyTarget=DB.settings.targets.study||60;
  if(sched.englishTarget==null) sched.englishTarget=DB.settings.targets.english||30;
  if(sched.buildTarget==null) sched.buildTarget=DB.settings.targets.portfolio||30;
  if(sched.prospectingTarget==null) sched.prospectingTarget=0;
  if(sched.salesCapacity==null) sched.salesCapacity=50;
  if(sched.powerCapacityDay==null) sched.powerCapacityDay=false;
  if(sched.businessDeepWorkTarget==null) sched.businessDeepWorkTarget=0;
  if(sched.gymRest==null) sched.gymRest=false;
  return sched;
}
function getDayType(dateStr){
  return getDaySchedule(dateStr).isUniversityDay?'university':'power';
}
function getDayBadge(dateStr){
  const sc=getDaySchedule(dateStr);
  if(sc.heavy)return {emoji:'🎓',label:'HEAVY UNIVERSITY DAY',color:'var(--yellow)'};
  if(sc.isPowerDay)return {emoji:'🔥',label:'POWER DAY',color:'var(--accent)'};
  if(sc.isUniversityDay)return {emoji:'🎓',label:'UNIVERSITY DAY',color:'var(--text-dim)'};
  return {emoji:'⚡',label:'FLEX DAY',color:'var(--text-dim)'};
}
function isGymDay(dateStr){
  const sc=getDaySchedule(dateStr);
  if(sc.gymRest)return false;
  return DB.settings.targets.gymDays.includes(dayAbbr(dateStr));
}
function getOutreachTargets(dateStr){
  const rec=getRecord(dateStr);
  const sc=getDaySchedule(dateStr);
  const capacity=sc.salesCapacity||0;
  const min=Math.min(10,capacity);
  const newAvailable=Math.max(0,capacity-rec.followupsDue);
  if(rec.examMode==='exam')return {min:0,std:0,stretch:0,capacity:0,newAvailable:0};
  if(rec.examMode==='prep')return {min,std:Math.min(newAvailable,min),stretch:min,capacity,newAvailable:Math.min(newAvailable,min)};
  return {min,std:newAvailable,stretch:capacity,capacity,newAvailable};
}
function suggestBreakActivity(mins,offline){
  if(!offline)return 'Follow-ups / outreach / replies if you have signal';
  if(mins<=45)return 'English audio, then quick recovery';
  if(mins<=75)return 'Recovery/food, then English';
  if(mins<=100)return 'Recovery/food → English → university study';
  return 'Recovery/food → English → university study → recovery/food before class';
}

/* ---------- score & xp ---------- */
function tierXP(val,tiers){ // tiers: [[thresh,xp],...] descending
  for(const [t,x] of tiers) if(val>=t) return x;
  return 0;
}
function xpForDay(dateStr){
  const rec=DB.records[dateStr]; if(!rec)return 0;
  const x=DB.settings.xp; let total=0;
  total+=tierXP(totalOutreach(rec),[[100,x.outreach100],[75,x.outreach75],[50,x.outreach50],[25,x.outreach25]]);
  total+=rec.followupsCompleted*x.followup;
  total+=rec.positiveReplies*x.positiveReply;
  total+=rec.calls*x.call;
  total+=rec.clientsClosed*x.client;
  total+=tierXP(rec.study,[[60,x.study60],[30,x.study30]]);
  total+=tierXP(rec.english,[[30,x.english30]]);
  if(rec.gymDone)total+=x.gym;
  if(Object.values(rec.morning).every(Boolean))total+=x.morningRoutine;
  if(Object.values(rec.night).every(Boolean))total+=x.nightRoutine;
  if(rec.sleepHours!=null && rec.sleepHours>=7)total+=x.sleepTarget;
  if(rec.classAttended)total+=x.classAttended;
  return Math.round(total);
}
function scoreBreakdown(dateStr){
  const rec=DB.records[dateStr];
  if(!rec)return {ratios:{},weights:{},score:0,isPower:false};
  const sc=getDaySchedule(dateStr);
  const isPower=!!sc.powerCapacityDay;
  const w=isPower?DB.settings.score.power:DB.settings.score.normal;

  const ot=getOutreachTargets(dateStr);
  const outreachRatio=ot.std>0?Math.min(1,totalOutreach(rec)/ot.std):1;
  const fupRatio=rec.followupsDue>0?Math.min(1,rec.followupsCompleted/rec.followupsDue):1;
  const prospectingRatio=sc.prospectingTarget>0?Math.min(1,rec.prospects/sc.prospectingTarget):1;
  let businessRatio;
  if(rec.clientWorkTarget>0) businessRatio=Math.min(1,rec.clientWork/rec.clientWorkTarget);
  else if(sc.businessDeepWorkTarget>0) businessRatio=Math.min(1,(rec.businessMinutes||0)/sc.businessDeepWorkTarget);
  else {
    const businessParts=[];
    if(ot.std>0) businessParts.push(outreachRatio);
    if(rec.followupsDue>0) businessParts.push(fupRatio);
    businessRatio=businessParts.length?businessParts.reduce((a,b)=>a+b,0)/businessParts.length:0;
  }
  const studyRatio=Math.min(1,rec.study/Math.max(1,sc.studyTarget));
  const englishRatio=Math.min(1,rec.english/Math.max(1,sc.englishTarget));
  const fitnessRatio=isGymDay(dateStr)?(rec.gymDone?1:0):1;
  const morningRatio=Object.values(rec.morning).filter(Boolean).length/6;
  const nightRatio=Object.values(rec.night).filter(Boolean).length/6;
  const deepWorkRatio=rec.deepWorkClean?1:0;

  const ratios=isPower
    ? {business:businessRatio,prospecting:prospectingRatio,outreach:outreachRatio,followups:fupRatio,study:studyRatio,english:englishRatio,gym:fitnessRatio,morningRoutine:morningRatio,nightRoutine:nightRatio,deepWork:deepWorkRatio}
    : {business:businessRatio,classes:classesRatio,study:studyRatio,gym:fitnessRatio,followups:fupRatio,english:englishRatio,morningRoutine:morningRatio,nightRoutine:nightRatio,outreach:outreachRatio,prospecting:prospectingRatio,deepWork:deepWorkRatio};

  const totalW=Object.values(w).reduce((a,b)=>a+b,0)||100;
  let score=Math.round(Object.keys(ratios).reduce((sum,k)=>sum+ratios[k]*(w[k]||0),0)/totalW*100);
  if(rec.recoveryDay) score=Math.max(score,70);
  score=Math.max(0,Math.min(100,score));
  return {ratios,weights:w,score,isPower};
}
function scoreForDay(dateStr){
  const rec=DB.records[dateStr]; if(!rec)return 0;
  return scoreBreakdown(dateStr).score;
}
function ratingFor(score){
  if(score>=90)return {emoji:'🔥',label:'EXCEPTIONAL',color:'var(--accent)'};
  if(score>=80)return {emoji:'🟢',label:'EXCELLENT',color:'var(--green)'};
  if(score>=70)return {emoji:'🟡',label:'SOLID',color:'var(--yellow)'};
  if(score>=50)return {emoji:'🟠',label:'NEEDS IMPROVEMENT',color:'var(--yellow)'};
  return {emoji:'🔴',label:'LOW',color:'var(--red)'};
}
function isNoZeroDay(dateStr){
  const rec=DB.records[dateStr]; if(!rec)return false;
  if(rec.recoveryDay)return true;
  const exam=rec.examMode||'normal';
  const ot=getOutreachTargets(dateStr);
  const outreachOk=ot.min<=0 || totalOutreach(rec)>=Math.min(10,ot.min);
  const fupOk=rec.followupsDue<=0 || rec.followupsCompleted>=rec.followupsDue;
  const engOk=rec.english>=20;
  const studyOk=exam==='exam'?rec.study>=60:rec.study>=30;
  const morningOk=Object.values(rec.morning).filter(Boolean).length>=3;
  if(exam==='exam')return fupOk && engOk && studyOk && morningOk; // outreach not required during exams
  return outreachOk && fupOk && engOk && studyOk && morningOk;
}
function computeStreak(){
  let streak=0; let d=todayStr();
  while(DB.records[d] && isNoZeroDay(d)){ streak++; d=addDays(d,-1); }
  return streak;
}
function lifetimeXP(){
  return Object.keys(DB.records).reduce((sum,d)=>sum+xpForDay(d),0);
}
const LEVEL_THRESH=[0,500,1500,3000,5000,7500,10500,14000,18000,22500,27500,33500,40000,47000,54500];
function levelInfo(xp){
  let lvl=1;
  for(let i=0;i<LEVEL_THRESH.length;i++){ if(xp>=LEVEL_THRESH[i]) lvl=i+1; }
  const curThresh=LEVEL_THRESH[lvl-1]!=null?LEVEL_THRESH[lvl-1]:LEVEL_THRESH[LEVEL_THRESH.length-1]+(lvl-LEVEL_THRESH.length)*7000;
  const nextThresh=LEVEL_THRESH[lvl]!=null?LEVEL_THRESH[lvl]:curThresh+7000;
  const pct=Math.min(1,(xp-curThresh)/(nextThresh-curThresh||1));
  return {level:lvl,curThresh,nextThresh,pct,xp};
}

function sparkline(values,color){
  const w=300,h=64,pad=4;
  const max=Math.max(1,...values);
  const stepX=values.length>1?(w-2*pad)/(values.length-1):0;
  const pts=values.map((v,i)=>{
    const x=pad+i*stepX;
    const y=h-pad-(v/max)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const areaPts=`${pad},${h-pad} ${pts} ${(w-pad).toFixed(1)},${h-pad}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;" preserveAspectRatio="none">
    <polyline points="${areaPts}" fill="${color}" opacity="0.12" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function graphCard(title,values,color,unit){
  const total=Math.round(values.reduce((a,b)=>a+b,0)*10)/10;
  const avg=values.length?Math.round((total/values.length)*10)/10:0;
  return `<div class="card">
    <div class="card-title">${title}</div>
    ${sparkline(values,color)}
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-faint);">
      <span>Total: <b style="color:var(--text);">${total}${unit||''}</b></span>
      <span>Daily avg: <b style="color:var(--text);">${avg}${unit||''}</b></span>
    </div>
  </div>`;
}
function sumRange(startStr,days){
  const out={outreach:0,followups:0,prospects:0,replies:0,positiveReplies:0,calls:0,clients:0,revenue:0,study:0,english:0,gym:0,portfolio:0,xp:0,scoreSum:0,scoreCount:0,sleepSum:0,sleepCount:0,
    classesAttended:0,assignments:0,businessLearning:0,skincareDays:0};
  for(let i=0;i<days;i++){
    const d=addDays(startStr,i);
    const rec=DB.records[d];
    if(!rec)continue;
    out.outreach+=totalOutreach(rec);
    out.followups+=rec.followupsCompleted;
    out.prospects+=rec.prospects;
    out.replies+=rec.replies;
    out.positiveReplies+=rec.positiveReplies;
    out.calls+=rec.calls;
    out.clients+=rec.clientsClosed;
    out.revenue+=rec.revenue;
    out.study+=rec.study;
    out.english+=rec.english;
    if(rec.gymDone)out.gym++;
    out.portfolio+=rec.portfolio;
    out.xp+=xpForDay(d);
    out.scoreSum+=scoreForDay(d); out.scoreCount++;
    if(rec.sleepHours!=null){out.sleepSum+=rec.sleepHours;out.sleepCount++;}
    out.assignments+=(rec.assignments||0);
    out.businessLearning+=(rec.businessLearning||0);
    if(rec.night&&rec.night.skincare)out.skincareDays++;
  }
  out.avgScore=out.scoreCount?Math.round(out.scoreSum/out.scoreCount):0;
  out.avgSleep=out.sleepCount?(out.sleepSum/out.sleepCount).toFixed(1):null;
  return out;
}
function delta(cur,prev){
  const diff=cur-prev;
  const pct=prev>0?Math.round((diff/prev)*100):(cur>0?100:0);
  return {diff,pct,dir:diff>0?'up':diff<0?'down':'flat'};
}
function fmtDelta(cur,prev,unit){
  unit=unit||'';
  const d=delta(cur,prev);
  const sign=d.diff>0?'+':'';
  const arrow=d.dir==='up'?'▲':d.dir==='down'?'▼':'–';
  return `<span class="cmp-delta ${d.dir}">${arrow} ${sign}${d.diff}${unit} (${sign}${d.pct}%)</span>`;
}

/* ---------- insights ---------- */
function generateInsights(){
  const insights=[];
  const dates=Object.keys(DB.records).sort();
  if(dates.length<7) return [{text:'Keep logging — insights appear after about a week of data.',cls:''}];
  const last28=dates.filter(d=>d>=addDays(todayStr(),-28));
  const byDow={};
  last28.forEach(d=>{ const dow=dayAbbr(d); byDow[dow]=(byDow[dow]||0)+totalOutreach(DB.records[d]); });
  const best=Object.entries(byDow).sort((a,b)=>b[1]-a[1])[0];
  if(best) insights.push({text:`Your outreach tends to be strongest on ${best[0][0].toUpperCase()+best[0].slice(1)}.`,cls:''});
  const uniDays=last28.filter(d=>getDayType(d)==='university');
  const powerDays=last28.filter(d=>getDayType(d)!=='university');
  if(uniDays.length&&powerDays.length){
    const uniAvg=uniDays.reduce((s,d)=>s+totalOutreach(DB.records[d]),0)/uniDays.length;
    const powAvg=powerDays.reduce((s,d)=>s+totalOutreach(DB.records[d]),0)/powerDays.length;
    if(powAvg>0){
      const dropPct=Math.round((1-uniAvg/powAvg)*100);
      if(dropPct>10) insights.push({text:`University days show ${dropPct}% lower outreach output than power days.`,cls:''});
    }
  }
  const engDays=last28.filter(d=>DB.records[d].english>=30).length;
  insights.push({text:`English consistency is ${Math.round(engDays/last28.length*100)}% over the last ${last28.length} days.`,cls:''});
  // sleep correlation
  const withSleep=last28.filter(d=>DB.records[d].sleepHours!=null);
  if(withSleep.length>=6){
    const good=withSleep.filter(d=>DB.records[d].sleepHours>=7);
    const bad=withSleep.filter(d=>DB.records[d].sleepHours<7);
    if(good.length&&bad.length){
      const goodAvg=good.reduce((s,d)=>s+totalOutreach(DB.records[d]),0)/good.length;
      const badAvg=bad.reduce((s,d)=>s+totalOutreach(DB.records[d]),0)/bad.length;
      if(goodAvg>badAvg*1.1) insights.push({text:'You tend to complete more outreach on days when you sleep 7+ hours.',cls:''});
    }
  }
  // 3-week decline detection
  const w1=sumRange(addDays(startOfWeek(todayStr()),-21),7).outreach;
  const w2=sumRange(addDays(startOfWeek(todayStr()),-14),7).outreach;
  const w3=sumRange(addDays(startOfWeek(todayStr()),-7),7).outreach;
  if(w1>w2 && w2>w3 && w3>0){
    insights.push({text:'Outreach has declined for 3 consecutive weeks. Suggested action: protect your first business block on university days.',cls:'bad'});
  }
  return insights.length?insights:[{text:'No strong patterns detected yet — keep logging.',cls:''}];
}
function detectWeakArea(){

  const withData=dates.filter(d=>DB.records[d]);

  const areas=[];

    capSum+=ot.std; outSum+=totalOutreach(r); dueSum+=r.followupsDue; doneSum+=r.followupsCompleted; });
  const businessPct=Math.round((( (capSum>0?outSum/capSum:1) + (dueSum>0?doneSum/dueSum:1) )/2)*100);
  areas.push({key:'business',label:'Business execution (outreach + follow-ups)',pct:Math.min(100,businessPct),
    reason:`You completed ${outSum}/${capSum} planned outreach and ${doneSum}/${dueSum} due follow-ups this week.`,
    action:'Complete follow-ups before starting new outreach tomorrow.'});
  // study

  withData.forEach(d=>{ const sc=getDaySchedule(d); studyTargetSum+=sc.studyTarget; studySum+=DB.records[d].study; });
  areas.push({key:'study',label:'University study',pct:studyTargetSum>0?Math.min(100,Math.round(studySum/studyTargetSum*100)):100,
    reason:`You studied ${Math.round(studySum/60*10)/10}h of a ${Math.round(studyTargetSum/60*10)/10}h weekly target.`,
    action:'Protect your next power-day study block first, before business tasks.'});
  // english
  let engTargetSum=0,engSum=0;
  withData.forEach(d=>{ const sc=getDaySchedule(d); engTargetSum+=sc.englishTarget; engSum+=DB.records[d].english; });
  areas.push({key:'english',label:'English practice',pct:engTargetSum>0?Math.min(100,Math.round(engSum/engTargetSum*100)):100,
    reason:`You logged ${engSum} of ${engTargetSum} target minutes of English this week.`,
    action:'Use your next commute or break for English audio.'});
  // prospecting
  let prospTargetSum=0,prospSum=0;
  withData.forEach(d=>{ const sc=getDaySchedule(d); prospTargetSum+=sc.prospectingTarget; prospSum+=DB.records[d].prospects; });
  if(prospTargetSum>0){
    areas.push({key:'prospecting',label:'Qualified prospect generation',pct:Math.min(100,Math.round(prospSum/prospTargetSum*100)),
      reason:`${prospSum} / ${prospTargetSum} qualified prospects prepared this week.`,
      action:'Increase your next power-day prospecting block by 60 minutes.'});
  }
  // fitness
  const gymDaysCount=withData.filter(d=>isGymDay(d)).length;
  const gymDone=withData.filter(d=>DB.records[d].gymDone).length;
  if(gymDaysCount>0){
    areas.push({key:'fitness',label:'Gym consistency',pct:Math.round(gymDone/gymDaysCount*100),
      reason:`${gymDone} / ${gymDaysCount} scheduled gym sessions completed.`,
      action:'Pre-plan your gym block time the night before.'});
  }
  areas.sort((a,b)=>a.pct-b.pct);
  return areas[0];
}

function nowClockString(){
  const n=new Date(); let h=n.getHours(); const m=pad(n.getMinutes()); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  return `${h}:${m} ${ap}`;
}
function getCurrentBlock(dateStr){
  if(dateStr!==todayStr())return null;
  const sc=getDaySchedule(dateStr);
  const now=new Date();
  const nowMins=now.getHours()*60+now.getMinutes();
  for(const b of sc.blocks){
    const s=minsBetween('00:00',b.start), e=minsBetween('00:00',b.end);
    if(nowMins>=s && nowMins<e) return Object.assign({},b,{remainingMins:e-nowMins});
  }
  return null;
}
function missionForBlockType(type,missions,opts){
  opts=opts||{};
  if(type==='business'){
    // Prospecting is meant to happen in the day's first business block —
    // once you're in a later one, it stops being offered as NOW/NEXT even
    // if incomplete, so the window keeps moving forward instead of getting
    // stuck pointing back at a morning task all day.
    const order=opts.isFirstBusinessBlock
      ? ['clientWork','followups','prospecting','outreach','businessDeepWork','build']
      : ['clientWork','followups','outreach','businessDeepWork','build'];
    for(const key of order){ const m=missions.find(x=>x.key===key); if(m && m.current<m.target) return m; }
    for(const key of order){ const m=missions.find(x=>x.key===key); if(m) return m; }
    return null;
  }
  if(type==='study') return missions.find(x=>x.key==='study')||null;
  if(type==='english') return missions.find(x=>x.key==='english')||null;
  if(type==='gym') return missions.find(x=>x.key==='gym')||null;
  return null; // break, meal, class, routine, recovery, sleep — not mission blocks
}
function getNowNext(dateStr){
  const sc=getDaySchedule(dateStr);
  const missions=getMissions(dateStr);
  const curBlock=getCurrentBlock(dateStr);
  const businessIndices=sc.blocks.map((b,i)=>b.type==='business'?i:-1).filter(i=>i>=0);
  const firstBusinessIdx=businessIndices.length?businessIndices[0]:-1;
  const resolve=(i)=>missionForBlockType(sc.blocks[i].type,missions,{isFirstBusinessBlock:i===firstBusinessIdx});
  let nowMission=null, passedMission=null, nextMission=null;

  if(curBlock){
    const idx=sc.blocks.findIndex(b=>b.start===curBlock.start && b.end===curBlock.end && b.label===curBlock.label);
    nowMission=resolve(idx);
    for(let i=idx-1;i>=0;i--){ const m=resolve(i); if(m){ passedMission=m; break; } }
    for(let i=idx+1;i<sc.blocks.length;i++){ const m=resolve(i); if(m){ nextMission=m; break; } }
  }
  // Fallback for when the current block isn't a mission block (break, meal,
  // class, etc.) or there's no active block at all — use plain priority order.
  if(!nowMission){
    const curIdx=currentMissionIndex(missions);
    nowMission=missions[curIdx]||null;
    if(!nextMission) nextMission=missions[curIdx+1]||null;
  }
  const curIdx=currentMissionIndex(missions);
  return {block:curBlock, passedMission, nowMission, nextMission, missions, curIdx};
}
function markMissionComplete(dateStr,missionKey){
  const rec=getRecord(dateStr);
  const m=getMissions(dateStr).find(x=>x.key===missionKey);
  if(!m)return;
  if(m.type==='counter') setPath(rec,m.field,m.target);
  else if(m.type==='toggle') setPath(rec,m.field,true);
  else if(m.type==='checklist') Object.keys(rec[m.field]).forEach(k=>rec[m.field][k]=true);
  saveDB(); renderView();
}

  const isToday=d===todayStr();
  const nowMins=isToday?(new Date().getHours()*60+new Date().getMinutes()):null;
  // Once a block's end time has passed, drop it — the window only ever
  // shows "now onward", never what's already behind you today.
  const upcomingBlocks=isToday?sc.blocks.filter(b=>minsBetween('00:00',b.end)>nowMins):sc.blocks;
  const visibleBlocks=UI.scheduleOpen?upcomingBlocks:upcomingBlocks.filter(isCurrentBlock);
  const dayOver=isToday && upcomingBlocks.length===0;
  return `

          ${b.type==='break'?`<div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${suggestBreakActivity(minsBetween(b.start,b.end),b.offline)}</div>`:''}

    }).join('')}

      inner+=`<div class="chiprow">
        <button class="chip ${UI.selectedChannel==='emails'?'active':''}" onclick="setChannel('emails')">Email</button>
        <button class="chip ${UI.selectedChannel==='dms'?'active':''}" onclick="setChannel('dms')">DM</button>
        <button class="chip ${UI.selectedChannel==='other'?'active':''}" onclick="setChannel('other')">Other</button>
      </div>`;
      inner+=`<div class="btnrow">${m.amounts.map(a=>`<button class="qbtn" onclick="bumpOutreach(${a})">+${a}</button>`).join('')}</div>`;
      inner+=`<div class="btnrow" style="margin-top:6px;">${m.amounts.map(a=>`<button class="qbtn neg" onclick="bumpOutreach(-${a})">−${a}</button>`).join('')}</div>`;
    }else{
      inner+=`<div class="btnrow">${m.amounts.map(a=>`<button class="qbtn" onclick="bump('${m.field}',${a})">+${a}</button>`).join('')}</div>`;
      inner+=`<div class="btnrow" style="margin-top:6px;">${m.amounts.map(a=>`<button class="qbtn neg" onclick="bump('${m.field}',-${a})">−${a}</button>`).join('')}</div>`;
    }
    if(m.adjustTarget){
      inner+=`<div class="mission-sub">Follow-ups due today: ${m.target} &nbsp; <a style="color:var(--accent);cursor:pointer;" onclick="bump('followupsDue',5)">+5</a> &nbsp; <a style="color:var(--accent);cursor:pointer;" onclick="bump('followupsDue',-5)">−5</a></div>`;
    }
    if(m.sub) inner+=`<div class="mission-sub">${m.sub}</div>`;
  }else if(m.type==='toggle'){
    inner+=`<button class="toggle-btn ${m.current>=m.target?'on':''}" onclick="toggleField('${m.field}')">${m.current>=m.target?'✓ COMPLETE':'MARK COMPLETE'}</button>`;
  }else if(m.type==='checklist'){
    inner+=`<div class="checklist">${m.items.map(([k,label])=>{
      const rec=getRecord(dateStr);
      const on=rec[m.field][k];
      return `<div class="check-row ${on?'strike':''}" onclick="toggleNested('${m.field}','${k}')">
        <div class="check-box ${on?'on':''}">${on?'✓':''}</div><div class="check-label">${label}</div></div>`;
    }).join('')}</div>`;
  }

  return `<div class="mission-card ${isCurrent?'current':''} ${done?'done':''}">
    <div class="mission-head">
      <div class="mission-title">${m.icon} ${m.label} ${isCurrent?'<span class="flag">CURRENT</span>':''}</div>
      ${done?'<div class="mission-complete-badge">✓ DONE</div>':`<div class="mission-nums">${m.current}<span class="target">/${m.target}${m.unit?m.unit:''}</span></div>`}
    </div>
    ${inner}
  </div>`;
}

/* ---------- WEEK ---------- */
function renderWeek(){
  const base=addDays(startOfWeek(todayStr()),UI.weekOffset*7);
  const cur=sumRange(base,7);
  const prevBase=addDays(base,-7);
  const prev=sumRange(prevBase,7);
  const label=UI.weekOffset===0?'THIS WEEK':(UI.weekOffset===-1?'LAST WEEK':`${shortDate(base)} – ${shortDate(addDays(base,6))}`);

  let barsOutreach='',barsScore='';
  for(let i=0;i<7;i++){
    const d=addDays(base,i);
    const rec=DB.records[d];
    const val=rec?totalOutreach(rec):0;
    const sc=rec?scoreForDay(d):0;
    const maxOut=Math.max(1,...[0,1,2,3,4,5,6].map(j=>{const dd=addDays(base,j);const r=DB.records[dd];return r?totalOutreach(r):0;}));
    barsOutreach+=`<div class="barcol"><div class="bar" style="height:${val?Math.max(4,(val/maxOut)*100):2}%;background:${d===todayStr()?'var(--accent)':'var(--surface3)'}"></div><span>${dayAbbr(d).slice(0,1).toUpperCase()}</span></div>`;
    barsScore+=`<div class="barcol"><div class="bar" style="height:${sc||2}%;background:${sc>=70?'var(--green)':sc>0?'var(--yellow)':'var(--surface3)'}"></div><span>${dayAbbr(d).slice(0,1).toUpperCase()}</span></div>`;
  }

  // 8-week trend — weekly total output
  let weekBars='';
  const weekTotals=[];
  for(let w=7;w>=0;w--){
    const wStart=addDays(base,-w*7);
    weekTotals.push(sumRange(wStart,7).outreach);
  }
  const maxWeek=Math.max(1,...weekTotals);
  weekTotals.forEach((v,i)=>{
    const isCur=i===7;
    weekBars+=`<div class="barcol"><div class="bar" style="height:${v?Math.max(4,(v/maxWeek)*100):2}%;background:${isCur?'var(--accent)':'var(--surface3)'}"></div><span>${isCur?'Now':'-'+(7-i)}</span></div>`;
  });

  const rows=[
    ['Outreach',cur.outreach,prev.outreach,''],
    ['Follow-ups',cur.followups,prev.followups,''],
    ['Prospects',cur.prospects,prev.prospects,''],
    ['Replies',cur.replies,prev.replies,''],
    ['Positive replies',cur.positiveReplies,prev.positiveReplies,''],
    ['Calls',cur.calls,prev.calls,''],
    ['Clients closed',cur.clients,prev.clients,''],
    ['Revenue',cur.revenue,prev.revenue,'$'],
    ['Study (min)',cur.study,prev.study,''],
    ['English (min)',cur.english,prev.english,''],
    ['Gym sessions',cur.gym,prev.gym,''],
    ['Portfolio / build (min)',cur.portfolio,prev.portfolio,''],
    ['Assignments',cur.assignments,prev.assignments,''],
    ['Business learning (min)',cur.businessLearning,prev.businessLearning,''],
    ['Skincare days',cur.skincareDays,prev.skincareDays,''],
    ['XP',cur.xp,prev.xp,''],
    ['Avg daily score',cur.avgScore,prev.avgScore,''],
  ];
  const prospectTarget=DB.settings.targets.weeklyProspectTarget||300;
  const outreachTarget=DB.settings.targets.weeklyOutreachTarget||250;
  const isSunday=UI.weekOffset===0 && dayAbbr(todayStr())==='sun';
  const weak=isSunday?detectWeakArea():null;

  return `
  <div class="topbar" style="padding:0 0 12px;max-width:none;">
    <button class="iconbtn" onclick="UI.weekOffset--;renderView();">‹</button>
    <div style="font-weight:700;font-size:14px;letter-spacing:.05em;">${label}</div>
    <button class="iconbtn" onclick="UI.weekOffset=Math.min(0,UI.weekOffset+1);renderView();">›</button>
  </div>
  ${weak?`
  <div class="card">
    <div class="card-title">⚠️ WEEKLY REVIEW — WEAKEST AREA</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
      <div style="font-weight:700;font-size:14px;">${weak.label}</div>
      <div class="stat-num" style="font-size:18px;color:${weak.pct<60?'var(--red)':'var(--yellow)'};">${weak.pct}%</div>
    </div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">${weak.reason}</div>
    <div class="insight" style="margin-bottom:0;">${weak.action}</div>
  </div>`:''}
  <div class="card">
    <div class="card-title">WEEKLY OUTREACH TARGET</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <div class="stat-num" style="font-size:24px;">${cur.outreach} / ${outreachTarget}</div>
      <div class="cmp-prev">${Math.max(0,outreachTarget-cur.outreach)} remaining</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,cur.outreach/outreachTarget*100)}%"></div></div>
  </div>
  <div class="card">
    <div class="card-title">WEEKLY PROSPECT INVENTORY</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <div class="stat-num" style="font-size:24px;">${cur.prospects} / ${prospectTarget}</div>
      <div class="cmp-prev">${Math.max(0,prospectTarget-cur.prospects)} remaining</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,cur.prospects/prospectTarget*100)}%"></div></div>
  </div>
  <div class="card">
    <div class="card-title">DAILY OUTREACH</div>
    <div class="barchart">${barsOutreach}</div>
  </div>
  <div class="card">
    <div class="card-title">DAILY SCORE</div>
    <div class="barchart">${barsScore}</div>
  </div>
  <div class="card">
    <div class="card-title">WEEKLY OUTREACH — LAST 8 WEEKS</div>
    <div class="barchart">${weekBars}</div>
  </div>
  <div class="section-label">THIS WEEK vs LAST WEEK</div>
  <div class="card">
    ${rows.map(([label,c,p,unit])=>`
      <div class="cmp-row">
        <div class="cmp-label">${label}</div>
        <div class="cmp-vals">
          <div><div class="cmp-cur">${unit}${c}</div><div class="cmp-prev">was ${unit}${p}</div></div>
          ${fmtDelta(c,p,'')}
        </div>
      </div>`).join('')}
  </div>
  `;
}

/* ---------- MONTH ---------- */
function renderMonth(){
  const now=parseDate(todayStr());
  const target=new Date(now.getFullYear(),now.getMonth()+UI.monthOffset,1);
  const y=target.getFullYear(), m=target.getMonth();
  const startStr=fmtDate(new Date(y,m,1));
  const days=daysInMonth(y,m);
  const cur=sumRange(startStr,days);
  const prevTarget=new Date(y,m-1,1);
  const prevStart=fmtDate(prevTarget);
  const prevDays=daysInMonth(prevTarget.getFullYear(),prevTarget.getMonth());
  const prev=sumRange(prevStart,prevDays);
  const label=monLabel(startStr).toUpperCase()+' '+y;

  const rows=[
    ['Outreach',cur.outreach,prev.outreach],
    ['Prospects',cur.prospects,prev.prospects],
    ['Follow-ups',cur.followups,prev.followups],
    ['Replies',cur.replies,prev.replies],
    ['Positive replies',cur.positiveReplies,prev.positiveReplies],
    ['Calls',cur.calls,prev.calls],
    ['Clients',cur.clients,prev.clients],
    ['Revenue ($)',cur.revenue,prev.revenue],
    ['Study (min)',cur.study,prev.study],
    ['English (min)',cur.english,prev.english],
    ['Gym sessions',cur.gym,prev.gym],
    ['Portfolio (min)',cur.portfolio,prev.portfolio],
    ['XP',cur.xp,prev.xp],
  ];

  // mini heatmap for the month
  const firstDow=(new Date(y,m,1).getDay()+6)%7; // Mon=0
  let cells='';
  for(let i=0;i<firstDow;i++) cells+=`<div class="heatcell pad"></div>`;
  for(let dnum=1;dnum<=days;dnum++){
    const ds=fmtDate(new Date(y,m,dnum));
    const rec=DB.records[ds];
    const sc=rec?scoreForDay(ds):null;
    let bg='var(--surface3)',cls='';
    if(sc!=null){ cls='has'; bg=sc>=80?'var(--green)':sc>=60?'var(--accent)':sc>=40?'var(--yellow)':'var(--red)'; }
    cells+=`<div class="heatcell ${cls}" style="background:${bg};opacity:${sc!=null?0.3+Math.min(0.7,sc/100):1}" onclick="openDayDetail('${ds}')">${dnum}</div>`;
  }

  return `
  <div class="topbar" style="padding:0 0 12px;max-width:none;">
    <button class="iconbtn" onclick="UI.monthOffset--;renderView();">‹</button>
    <div style="font-weight:700;font-size:14px;letter-spacing:.05em;">${label}</div>
    <button class="iconbtn" onclick="UI.monthOffset=Math.min(0,UI.monthOffset+1);renderView();">›</button>
  </div>
  <div class="card">
    <div class="card-title">MONTH AT A GLANCE</div>
    <div class="weekday-hdr"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="heatgrid">${cells}</div>
  </div>
  <div class="section-label">${label} vs ${monLabel(prevStart).toUpperCase()}</div>
  <div class="card">
    ${rows.map(([label,c,p])=>`
      <div class="cmp-row">
        <div class="cmp-label">${label}</div>
        <div class="cmp-vals">
          <div><div class="cmp-cur">${c}</div><div class="cmp-prev">was ${p}</div></div>
          ${fmtDelta(c,p,'')}
        </div>
      </div>`).join('')}
  </div>
  `;
}

function addGoal(){
  const name=el('ng_name').value.trim()||'New goal';

function bumpGoal(id,amt){
  const g=DB.goals.custom.find(x=>x.id===id); if(!g)return;

}
function removeGoal(id){
  DB.goals.custom=DB.goals.custom.filter(x=>x.id!==id); saveDB(); renderView();
}
function toggleMilestone(id){
  const m=DB.goals.milestones.find(x=>x.id===id); if(!m)return;
  m.done=!m.done; saveDB(); renderView();
}

/* ============================================================
   ACTIONS
   ============================================================ */
function bump(field,amount){
  const d=todayStr(); const rec=getRecord(d);
  const before=getPath(rec,field);
  setPath(rec,field,Math.max(0,before+amount));
  if(field==='prospects' && amount>0){ DB.pool.ready=Math.max(0,(DB.pool.ready||0)+amount); }
  saveDB();
  showToast(`${field.split('.').pop()} ${amount>0?'+':''}${amount}`,()=>{ setPath(rec,field,before); if(field==='prospects'&&amount>0)DB.pool.ready=Math.max(0,(DB.pool.ready||0)-amount); saveDB(); renderView(); if(UI.focusOpen)el('modalRoot').innerHTML=renderFocus(); });
  renderView();
  if(UI.focusOpen)el('modalRoot').innerHTML=renderFocus();
}
function bumpPool(amount){
  DB.pool.ready=Math.max(0,(DB.pool.ready||0)+amount);
  saveDB(); renderView();
}
function bumpOutreach(amount){
  const field='outreach.'+UI.selectedChannel;
  bump(field,amount);
}
function setChannel(c){ UI.selectedChannel=c; renderView(); if(UI.focusOpen)el('modalRoot').innerHTML=renderFocus(); }
function toggleField(field){
  const d=todayStr(); const rec=getRecord(d);
  setPath(rec,field,!getPath(rec,field));
  saveDB(); renderView(); if(UI.focusOpen)el('modalRoot').innerHTML=renderFocus();
}
function setExamMode(tier){
  const rec=getRecord(todayStr());
  rec.examMode=tier;
  saveDB(); renderView();
}
function toggleNested(group,key){
  const d=todayStr(); const rec=getRecord(d);
  rec[group][key]=!rec[group][key];
  saveDB(); renderView(); if(UI.focusOpen)el('modalRoot').innerHTML=renderFocus();
}
function setNum(field,val){
  const d=todayStr(); const rec=getRecord(d);
  const num=val===''?null:parseFloat(val);
  setPath(rec,field,isNaN(num)?null:num);
  saveDB(); renderView();
}

    <div class="sheet"><div class="sheet-title">Add revenue</div>

function addRevenue(){
  const amt=parseFloat(el('rev_amt').value)||0;
  const rec=getRecord(todayStr());
  rec.revenue+=amt; saveDB(); closeModal(); renderView();
}
function closeModal(){ el('modalRoot').innerHTML=''; }

function setDayField(ds,field,val){
  const rec=getRecord(ds);
  const num=parseFloat(val); setPath(rec,field,isNaN(num)?0:num);
  saveDB(); renderView();
}

function setSetting(path,val,isNum){
  let v=val;
  if(isNum){ v=parseFloat(val); if(isNaN(v))v=0; }
  setPath(DB.settings,path,v);
  saveDB(); renderView();
}
function setSchedule(day,field,val){
  DB.settings.weekSchedule[day][field]=val;
  saveDB(); renderView();
}
function toggleScheduleFlag(day,field){
  const sc=DB.settings.weekSchedule[day];
  sc[field]=!sc[field];
  saveDB(); renderView();
}
function setScheduleNum(day,field,val){
  const sc=DB.settings.weekSchedule[day];
  const n=parseFloat(val); sc[field]=isNaN(n)?0:n;
  saveDB(); renderView();
}
function addBlock(day,type){
  const labels={break:'Break',business:'Business deep work',study:'University study',english:'English — 30 minutes',gym:'Gym block — 20 travel + 60 workout + 20 travel',meal:'Meal',routine:'Routine',recovery:'Recovery',sleep:'Sleep target'};
  const start='09:00', end=type==='sleep'?'09:00':'09:50';
  DB.settings.weekSchedule[day].blocks.push({start,end,type,label:labels[type]||type,offline:type==='break'});
  saveDB(); renderView();
}
function removeBlock(day,i){
  DB.settings.weekSchedule[day].blocks.splice(i,1);
  saveDB(); renderView();
}
function setBlockField(day,i,field,val){
  DB.settings.weekSchedule[day].blocks[i][field]=val;
  saveDB(); renderView();
}
function toggleBlockOffline(day,i){
  const b=DB.settings.weekSchedule[day].blocks[i];
  b.offline=!b.offline;
  saveDB(); renderView();
}
function toggleGymDay(day){
  const arr=DB.settings.targets.gymDays;
  const idx=arr.indexOf(day);
  if(idx>=0)arr.splice(idx,1); else arr.push(day);
  saveDB(); renderView();
}
function setTheme(t){
  DB.settings.theme=t;
  applyTheme();
  saveDB(); renderView();
}
function applyTheme(){
  let t=DB.settings.theme;
  if(t==='system'){ t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
  document.documentElement.setAttribute('data-theme',t);
}

/* ---------- day complete ---------- */

  const score=scoreForDay(d); const xp=xpForDay(d); const streak=computeStreak();
  DB.meta.bestStreak=Math.max(DB.meta.bestStreak||0,streak); saveDB();

        <div><div class="stat-num">${xp}</div><div class="stat-label">XP</div></div>
        <div><div class="stat-num">${totalOutreach(rec)}</div><div class="stat-label">Outreach</div></div>
        <div><div class="stat-num">🔥${streak}</div><div class="stat-label">Streak</div></div>
      </div>
      <button class="btn-primary" onclick="closeModal()">DONE</button>
    </div></div>`;
}

/* ---------- toast ---------- */
let toastTimer=null;
function showToast(text,undoFn){
  clearTimeout(toastTimer);
  const t=el('toast');
  t.innerHTML=`<span>${text}</span><button onclick="undoAction()">UNDO</button>`;
  t.style.display='flex';
  undoStack=undoFn;
  toastTimer=setTimeout(()=>{ t.style.display='none'; undoStack=null; },4000);
}
function undoAction(){
  if(undoStack)undoStack();
  el('toast').style.display='none';
  undoStack=null;
}

/* ---------- export / import ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='execution-os-backup-'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const dates=Object.keys(DB.records).sort();
  const headers=['date','outreach','followups_completed','followups_due','prospects','replies','positive_replies','calls','clients','revenue','study_min','english_min','gym','portfolio_min','business_deep_work_min','business_learning_min','assignments','exam_mode','score','xp'];
  let rows=[headers.join(',')];
  dates.forEach(d=>{
    const r=DB.records[d];
    rows.push([d,totalOutreach(r),r.followupsCompleted,r.followupsDue,r.prospects,r.replies,r.positiveReplies,r.calls,r.clientsClosed,r.revenue,r.study,r.english,r.gymDone?1:0,r.portfolio,r.businessMinutes||0,r.businessLearning||0,r.assignments||0,r.examMode||'normal',scoreForDay(d),xpForDay(d)].join(','));
  });
  const blob=new Blob([rows.join(String.fromCharCode(10))],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='execution-os-'+todayStr()+'.csv'; a.click();
  URL.revokeObjectURL(url);
}
function importJSON(){
  const fileInput=el('importFile');
  if(!fileInput.files.length){ alert('Choose a JSON backup file first.'); return; }
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.settings||!data.records){ alert('This file does not look like a valid backup.'); return; }
      DB=data;
      DB.settings=Object.assign(defaultSettings(),DB.settings||{});
      if(DB.settings.score && DB.settings.score.power && DB.settings.score.normal){
        DB.settings.score.power=Object.assign({},defaultSettings().score.power,DB.settings.score.power);
        DB.settings.score.normal=Object.assign({},defaultSettings().score.normal,DB.settings.score.normal);
      }else{
        DB.settings.score=defaultSettings().score;
      }
      if(!DB.goals)DB.goals=defaultGoals();
      if(!DB.meta)DB.meta={bestStreak:0};
      if(!DB.pool)DB.pool={ready:0};
      Object.values(DB.records||{}).forEach(r=>{
        if(typeof r.examMode==='boolean') r.examMode=r.examMode?'exam':'normal';
        if(r.businessMinutes==null) r.businessMinutes=0;
        if(r.deepWorkClean==null) r.deepWorkClean=false;
      });
      if(!DB.schemaVersion)DB.schemaVersion=8;
      STORAGE_UNAVAILABLE=false; // an explicit import is a good moment to retry local storage
      const ok=await persistNow();
      applyTheme();
      render();
      alert(ok?'Backup imported.':'Backup loaded, but saving to local storage failed — export a copy now so you don\u2019t lose it.');
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(fileInput.files[0]);
}
function confirmReset(){
  el('modalRoot').innerHTML=`<div class="overlay center" onclick="if(event.target===this)closeModal()">
    <div class="sheet" style="text-align:center;">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px;">Reset all data?</div>
      <div style="font-size:12px;color:var(--text-faint);margin-bottom:16px;">This permanently deletes every record, streak, and goal. Export a backup first if you're not sure.</div>
      <button class="btn-primary" style="background:var(--red);" onclick="doReset()">DELETE EVERYTHING</button>
      <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
    </div></div>`;
}
async function doReset(){
  STORAGE_UNAVAILABLE=false;
  try{ await idbClearState(); }catch(e){ console.warn('idbClearState failed (continuing with overwrite)',e); }
  DB={settings:defaultSettings(),records:{},goals:defaultGoals(),meta:{bestStreak:0},pool:{ready:0},schemaVersion:8};
  await persistNow();
  closeModal(); applyTheme(); render();
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadDB();
  applyTheme();
  render();
  setInterval(()=>{ if(UI.view==='today' && !UI.focusOpen) renderView(); }, 30000);
}
init();

// Register the service worker for offline/PWA support. This is separate
// from app data storage (IndexedDB above) — it only caches the static
// files so the app can load with no network connection.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>{
      console.warn('Service worker registration failed (app still works online):',err);
    });
  });
}
</script>
